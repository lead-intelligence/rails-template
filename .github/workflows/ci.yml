name: CI

on:
  # A pull request into main only: an epic's stories go into its branch, and
  # nothing waits for their CI.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # The fallback when no ci-linux runner is up: run it by hand on GitHub's
  # own runners, which spend the organization's minutes.
  workflow_dispatch:
    inputs:
      runner:
        description: Where it runs
        type: choice
        options: [ ci-linux, ubuntu-latest ]
        default: ci-linux

permissions:
  contents: read
  # Pulls the CI image while its package is private.
  packages: read
  # Reads whether a merge's pull request passed CI.
  checks: read

jobs:
  ci:
    # A private app runs on our own VMs (Peronix's bin/peronix-ci-runner): no
    # GitHub minutes. ci-linux is any native one, ARM or x86: the CI image
    # holds both architectures, and the lockfile both platforms. A public
    # repository, such as this template, runs on GitHub's, free for it: our
    # runners never take a stranger's pull request.
    runs-on: ${{ inputs.runner || (github.event.repository.private && 'ci-linux' || 'ubuntu-latest') }}
    timeout-minutes: 45
    # The Debian and libvips that production runs (Dockerfile), so a test
    # passes here only where it passes in production: the runner's own
    # packages change without notice. The image (.github/ci/Dockerfile) has
    # the packages and the template's gems built, so a run starts at the gems
    # its app changed. test/ci/ruby_version_test.rb keeps the Ruby as .ruby-version.
    container:
      image: ghcr.io/lead-intelligence/rails-ci:4.0.10
      # The image is private. An app reads it with the organization's
      # read:packages token (GHCR_READ, also a Dependabot secret); the
      # template, the package's own repository, with its job token.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_READ || github.token }}
    env:
      # The read-only token of the private charco_mobile gem: bin/ci installs
      # the gems again in its rename smoke, so the whole job needs it.
      BUNDLE_GITHUB__COM: x-access-token:${{ secrets.CHARCO_MOBILE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A merge's second parent is its pull request's head.
          fetch-depth: 2

      # A merge into main whose code is its pull request's head, which passed
      # CI, needs no second run: the code is the same, and Deploy waits for
      # this run. A merge whose code differs runs everything.
      - name: Skip a merge its pull request already tested
        id: tested
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          head="$(git rev-parse -q --verify 'HEAD^2' || true)"
          [ -n "$head" ] && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ] || exit 0
          passed="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=ci" |
            ruby -rjson -e 'puts JSON.parse($stdin.read)["check_runs"].any? { |run| run["conclusion"] == "success" }')"
          if [ "$passed" = true ]; then
            echo "The pull request's head $head passed CI on this same code."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gems
        if: steps.tested.outputs.done != 'true'
        run: bundle install --jobs 4

      # A failed bin/ci whose failures are only tests runs them again alone,
      # in seconds (bin/rerun-failed-tests).
      - name: Run quality gate
        if: steps.tested.outputs.done != 'true'
        shell: bash
        env:
          RAILS_ENV: test
        run: |
          mkdir -p tmp
          bin/ci 2>&1 | tee tmp/ci.log
          [ "${PIPESTATUS[0]}" = 0 ] || bin/rerun-failed-tests tmp/ci.log

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
