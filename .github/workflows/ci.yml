name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    # The Debian and libvips that production runs (Dockerfile), so a test
    # passes here only where it passes in production: the runner's own
    # packages change without notice. Keep the Ruby version as .ruby-version.
    container: ruby:4.0.6-slim
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Install packages
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y build-essential chromium curl file fonts-liberation git libvips libyaml-dev openssh-client pkg-config

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Look for the charco_mobile deploy key
        id: mobile_deploy_key
        run: echo "present=${{ secrets.CHARCO_MOBILE_DEPLOY_KEY != '' }}" >> $GITHUB_OUTPUT

      - name: Let Bundler read the charco_mobile repository
        if: steps.mobile_deploy_key.outputs.present == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CHARCO_MOBILE_DEPLOY_KEY }}

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock', '.ruby-version') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run quality gate
        env:
          RAILS_ENV: test
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
