name: Deploy

# Production is main, once CI is green on it: every app deploys the same way, and Peronix
# only merges. Bruno can still run `bin/kamal deploy` by hand.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

# Kamal takes a deploy lock, so two runs at once would have one of them fail on the lock
# rather than queue behind it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # CI runs finish out of order, so a green run for an older commit can arrive after a newer
  # one deployed. Only the commit at the tip of main deploys; a newer one brings its own run.
  latest:
    # The template has no server key and a placeholder domain: only the apps born from it deploy.
    # A push to this repository's main only: the branches filter also matches a pull request's
    # head branch, so a fork's branch named main would otherwise deploy with these secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository != 'lead-intelligence/rails-template'
    # The production server's own runner, which takes only this workflow from each app's main
    # (the organization's deploy runner group, where bin/peronix-new-app adds it): no GitHub
    # minutes.
    runs-on: deploy
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Compare with the tip of main
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        # The server has no gh: this media type answers with the bare SHA.
        run: |
          tip="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.sha" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main")"
          echo "current=$([ "$tip" = "$HEAD_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: latest
    if: needs.latest.outputs.current == 'true'
    runs-on: deploy

    permissions:
      contents: read
      packages: write

    # The read-only token of the private charco_mobile gem, for Bundler here
    # and for the image build (config/deploy.yml).
    env:
      BUNDLE_GITHUB__COM: x-access-token:${{ secrets.CHARCO_MOBILE_TOKEN }}

    steps:
      # `workflow_run` checks out the default branch's HEAD unless told otherwise, which is not
      # necessarily the commit CI just went green on.
      - name: Checkout the commit the gate passed on
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Before the server key: every gem's install code runs here.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # One key reaches the server for every app.
      - name: Load the server key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PERONIX_DEPLOY_KEY }}

      # The server's own host keys, written down rather than scanned on every run: scanning
      # trusts whatever answers first. Check them against `ssh-keyscan 2.28.229.5 | ssh-keygen -lf -`
      # if the server is ever rebuilt.
      - name: Trust the server
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts <<'KEYS'
          2.28.229.5 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKAM5FxrL/NsyrSR94W4y/v8e/w7UK2u65+iKis4dhkLmUgMbHSUsIS0zD4CPAqDmRRBHLZYT71ZpZFACBXEzmI=
          2.28.229.5 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIn/ePKyQSxis1Z9ZJQFJ/31XQvoy5ERD7/t6JUFrJ21
          KEYS

      # The master key never enters the repository: it stays on the server, where Peronix made
      # it (bin/peronix-new-app), and .kamal/secrets reads it from config/master.key.
      - name: Unlock the credentials
        run: |
          app="${GITHUB_REPOSITORY#*/}"
          ssh root@2.28.229.5 cat "/root/.config/peronix/apps/${app//-/_}.key" > config/master.key
          test -s config/master.key

      # The runner's own token is enough to push to and pull from GHCR for the length of this job.
      - name: Deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bin/kamal deploy

      # The server's runner keeps its workspace after the job, unlike GitHub's.
      - name: Forget the credentials key
        if: always()
        run: rm -f config/master.key
