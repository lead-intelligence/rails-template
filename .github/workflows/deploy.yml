name: Deploy

# Production is main, once CI is green on it: every app deploys the same way, and Peronix
# only merges. Bruno can still run `bin/kamal deploy` by hand.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

# Kamal takes a deploy lock, so two runs at once would have one of them fail on the lock
# rather than queue behind it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # The template has no server key and a placeholder domain: only the apps born from it deploy.
    if: github.event.workflow_run.conclusion == 'success' && github.repository != 'lead-intelligence/rails-template'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # The read-only token of the private charco_mobile gem, for Bundler here
    # and for the image build (config/deploy.yml).
    env:
      BUNDLE_GITHUB__COM: x-access-token:${{ secrets.CHARCO_MOBILE_TOKEN }}

    steps:
      # `workflow_run` checks out the default branch's HEAD unless told otherwise, which is not
      # necessarily the commit CI just went green on.
      - name: Checkout the commit the gate passed on
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # One key reaches the server for every app.
      - name: Load the server key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PERONIX_DEPLOY_KEY }}

      # The server's own host keys, written down rather than scanned on every run: scanning
      # trusts whatever answers first. Check them against `ssh-keyscan 2.28.229.5 | ssh-keygen -lf -`
      # if the server is ever rebuilt.
      - name: Trust the server
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts <<'KEYS'
          2.28.229.5 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKAM5FxrL/NsyrSR94W4y/v8e/w7UK2u65+iKis4dhkLmUgMbHSUsIS0zD4CPAqDmRRBHLZYT71ZpZFACBXEzmI=
          2.28.229.5 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIn/ePKyQSxis1Z9ZJQFJ/31XQvoy5ERD7/t6JUFrJ21
          KEYS

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The master key never enters the repository: it stays on the server, where Peronix made
      # it (bin/peronix-new-app), and .kamal/secrets reads it from config/master.key.
      - name: Unlock the credentials
        run: |
          app="${GITHUB_REPOSITORY#*/}"
          ssh root@2.28.229.5 cat "/root/.config/peronix/apps/${app//-/_}.key" > config/master.key
          test -s config/master.key

      # The runner's own token is enough to push to and pull from GHCR for the length of this job.
      - name: Deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bin/kamal deploy
